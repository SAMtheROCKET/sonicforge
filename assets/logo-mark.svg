<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140"
     role="img" aria-label="SonicForge mark">
  <title>SonicForge</title>
  <defs>
    <linearGradient id="m-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="62%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="m-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131A2B"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <filter id="m-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(14 14)">
    <rect width="112" height="112" rx="28" fill="url(#m-plate)"/>
    <rect x="1" y="1" width="110" height="110" rx="27" fill="none"
          stroke="#00F2FE" stroke-opacity=".28" stroke-width="2"/>
    <path d="M88 34a38 38 0 0 1 0 44" fill="none" stroke="#7F00FF"
          stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <path d="M96 24a52 52 0 0 1 0 64" fill="none" stroke="#7F00FF"
          stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
    <g filter="url(#m-glow)">
      <path d="M14 56h10c4 0 6-30 11-30s7 58 11 58 6-28 11-28h8c4 0 6-18 11-18s7 36 11 36"
            fill="none" stroke="url(#m-wave)" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
